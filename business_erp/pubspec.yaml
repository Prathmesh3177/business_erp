name: business_erp
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  erp_application:
    path: ../packages/erp_application
  erp_domain:
    path: ../packages/erp_domain
  erp_local_data:
    path: ../packages/erp_local_data
  erp_platform:
    path: ../packages/erp_platform
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.1
  intl: 0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/l10n/app_en.arb
    - lib/l10n/app_mr.arb

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
